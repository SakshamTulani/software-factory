# Enforces the branching strategy in docs/agents/git.md on every PR into
# main and develop.
# Works for both strategies: every develop check skips itself when there is
# no develop branch.
#
# pull_request_target runs this file from the BASE branch, so a PR cannot
# weaken its own guard. It only inspects git history and never checks out,
# installs or runs code from the PR.
name: PR guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  flow:
    name: pr-guard-flow
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.base_ref }}
      HEAD: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
      TITLE: ${{ github.event.pull_request.title }}
      BODY: ${{ github.event.pull_request.body }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR head (history only, never executed)
        run: git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/head"

      # Editing the title re-runs this.
      - name: PR title format
        run: |
          re='^(feat|fix|chore|refactor|perf|docs|hotfix|enhance|test|style|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $re && "$TITLE" != Revert\ * ]]; then
            echo "::error title=PR title format::Title should look like: type(scope): summary. type is feat, fix, chore, refactor, perf, docs, hotfix, enhance, test, style, build, ci or revert. Example: feat(command-center): send immobilise commands. Got: $TITLE"
            exit 1
          fi

      # Release PRs wait until the backend they need is live. Drafts are
      # skipped; marking ready or editing the description re-runs this.
      - name: Backend is live before release
        if: ${{ !github.event.pull_request.draft && github.base_ref == 'main' }}
        run: |
          if grep -Eiq '^\s*- \[x\] Needs a backend change' <<<"$BODY" \
            && ! grep -Eiq '^\s*- \[x\] Backend change is live in production' <<<"$BODY"; then
            echo "::error::This PR needs a backend change. Tick \"Backend change is live in production\" once it is released."
            exit 1
          fi

      # An agent can rewrite a test to match broken code, so a change to an
      # existing test needs a person's read; new test files don't. Load-bearing
      # paths come from factory.json on the base branch, so a PR can't drop
      # its own paths from the list. Ticking a box re-runs this.
      - name: Changed tests and load-bearing paths read by a person
        run: |
          base=$(git merge-base "origin/$BASE" "$HEAD_SHA")
          fail=0
          tests=$(git diff --name-only --diff-filter=MDR "$base" "$HEAD_SHA" -- '*.test.ts' '*.test.tsx')
          if [ -n "$tests" ] && ! grep -Eiq '^\s*- \[x\] A person read the changes to existing tests' <<<"$BODY"; then
            echo "::error::This PR changes, renames or deletes existing tests. A person must read them, then tick \"A person read the changes to existing tests\". New test files don't need this."
            echo "$tests"
            fail=1
          fi
          globs=()
          if [ -f factory.json ]; then
            while IFS= read -r g; do globs+=(":(glob)$g"); done < <(jq -r '.loadBearing // [] | .[]' factory.json)
          fi
          if [ ${#globs[@]} -gt 0 ]; then
            touched=$(git diff --name-only "$base" "$HEAD_SHA" -- "${globs[@]}")
            if [ -n "$touched" ] && ! grep -Eiq '^\s*- \[x\] A person read the load-bearing changes' <<<"$BODY"; then
              echo "::error::This PR touches load-bearing paths (factory.json loadBearing). A person must read them, then tick \"A person read the load-bearing changes\"."
              echo "$touched"
              fail=1
            fi
          fi
          exit $fail

      # main    <- feat/ fix/ chore/ refactor/ perf/ docs/ hotfix/, revert-*   (never develop)
      # develop <- same, merge/<feature> for conflicts, main for back-merges
      # revert-* is the branch GitHub's Revert button creates.
      - name: Source branch allowed for this base
        run: |
          ok=false
          case "$BASE" in
            main)
              allowed="feat/ fix/ chore/ refactor/ perf/ docs/ hotfix/ revert-*"
              [[ "$HEAD" =~ ^(feat|fix|chore|refactor|perf|docs|hotfix)/ || "$HEAD" =~ ^revert- ]] && ok=true ;;
            develop)
              allowed="feat/ fix/ chore/ refactor/ perf/ docs/ hotfix/ merge/ revert-* main"
              [[ "$HEAD" =~ ^(feat|fix|chore|refactor|perf|docs|hotfix|merge)/ || "$HEAD" =~ ^revert- || "$HEAD" == main ]] && ok=true ;;
          esac
          if [ "$ok" != true ]; then
            echo "::error::$HEAD cannot merge into $BASE. Allowed sources for $BASE: $allowed"
            echo "Rename the branch with an allowed prefix (GitHub → Branches → rename keeps open PRs)."
            echo "This check's result shows on every PR from $HEAD; the base named above is the one that failed."
            exit 1
          fi

      # develop's first-parent history holds only commits made on develop.
      # A branch that contains any of them has pulled develop in.
      - name: Branch does not contain develop
        if: >-
          github.head_ref != 'main'
          && !startsWith(github.head_ref, 'merge/')
        run: |
          # A GitHub revert into develop is cut from develop; skip only when
          # every commit on it is a revert.
          if [[ "$HEAD" == revert-* && "$BASE" == develop ]] \
            && [ -z "$(git log --format=%s origin/develop.."$HEAD_SHA" | grep -v '^Revert "')" ]; then
            echo "$HEAD only reverts develop work; develop-leak check not needed."
            exit 0
          fi
          git rev-parse -q --verify origin/develop >/dev/null || exit 0
          leaked=$(comm -12 \
            <(git rev-list --first-parent origin/main..origin/develop | sort) \
            <(git rev-list origin/main.."$HEAD_SHA" | sort))
          if [ -n "$leaked" ]; then
            # The merge that pulled develop in: its second parent reaches a
            # leaked commit, its first parent does not.
            probe=$(echo "$leaked" | head -1)
            culprits=$(for m in $(git rev-list --merges origin/main.."$HEAD_SHA"); do
              git merge-base --is-ancestor "$probe" "$m^2" \
                && ! git merge-base --is-ancestor "$probe" "$m^1" \
                && echo "$m"
            done)
            echo "::error::$HEAD has develop merged into it and can never merge into main."
            if [ -n "$culprits" ]; then
              echo "Develop came in through this merge on $HEAD:"
              git log --oneline --no-walk $culprits
              echo "Reset $HEAD to the commit before that merge, re-merge main, and force-push."
            else
              echo "Cut a fresh branch from main and cherry-pick only your own commits."
            fi
            echo "To resolve develop conflicts, use a merge/<feature> branch instead."
            echo "Develop commits now in $HEAD:"
            git log --oneline --no-walk $leaked
            exit 1
          fi

      # Needs develop PRs merged with a merge commit, which keeps the SHAs.
      # Drafts are skipped; marking ready re-runs this. Reverts of a main
      # merge go straight to main.
      - name: Tested in develop first
        if: >-
          github.base_ref == 'main'
          && !github.event.pull_request.draft
          && !startsWith(github.head_ref, 'hotfix/')
          && !startsWith(github.head_ref, 'revert-')
        run: |
          git rev-parse -q --verify origin/develop >/dev/null || exit 0
          git merge-base --is-ancestor "$HEAD_SHA" origin/develop && exit 0
          # Main merged in after the develop merge (e.g. "Update branch") is
          # fine: every commit not in develop or main must be a clean merge
          # whose second parent is in main, so it adds nothing untested.
          ok=true
          for c in $(git rev-list "$HEAD_SHA" ^origin/develop ^origin/main); do
            read -r _ p1 p2 extra <<<"$(git rev-list --parents -n 1 "$c")"
            if [ -z "$p2" ] || [ -n "$extra" ] \
              || ! git merge-base --is-ancestor "$p2" origin/main \
              || [ "$(git merge-tree --write-tree "$p1" "$p2" 2>/dev/null | head -1)" != "$(git rev-parse "$c^{tree}")" ]; then
              ok=false; break
            fi
          done
          if [ "$ok" != true ]; then
            echo "::error::Merge this branch's develop PR first, then re-run this check."
            echo "Main only takes code that was tested in develop."
            exit 1
          fi

      - name: Hotfix also flows down
        if: startsWith(github.head_ref, 'hotfix/') && github.base_ref == 'main'
        run: |
          git rev-parse -q --verify origin/develop >/dev/null || exit 0
          n=$(gh pr list --head "$HEAD" --base develop --state all --json number --jq length)
          if [ "$n" = 0 ]; then
            echo "::error::Open a PR from $HEAD into develop as well, then re-run this check."
            exit 1
          fi

  # Opening a hotfix's develop PR re-runs the failed guard on its main PR,
  # so "Hotfix also flows down" clears itself. Both PRs share the head SHA.
  rerun-sibling:
    if: >-
      github.event.action == 'opened'
      && startsWith(github.head_ref, 'hotfix/')
      && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    env:
      HEAD: ${{ github.head_ref }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Re-run the main PR's guard
        run: |
          sha=$(gh pr list --head "$HEAD" --base main --state open --json headRefOid --jq '.[0].headRefOid // empty')
          [ -n "$sha" ] || exit 0
          gh run list --workflow pr-guard.yml --commit "$sha" --json databaseId,conclusion \
            --jq '.[] | select(.conclusion == "failure") | .databaseId' \
            | while read -r id; do gh run rerun "$id" --failed; done
